name: Build SkyOP Client

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skyop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile Minecraft 26.3 mod
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Build and run verification tasks
        run: gradle --no-daemon clean build

      - name: Verify installable mod JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR_PATH="$(find build/libs -maxdepth 1 -type f -name 'skyop-client-*.jar' ! -name '*-sources.jar' | sort | head -n 1)"
          if [[ -z "$JAR_PATH" ]]; then
            echo 'No SkyOP mod JAR was produced.'
            find build/libs -maxdepth 1 -type f -print || true
            exit 1
          fi

          # Minecraft 26.3 SDL keyboard-state regression guard.
          grep -Fq 'SDL_SCANCODE_COUNT = 512' src/main/java/id/skyop/client/SkyOPSdlKeyboardIndex.java
          grep -Fq 'method = "isKeyDown(I)Z"' src/client/java/id/skyop/mixin/InputConstantsMixin.java
          grep -Fq 'int key' src/client/java/id/skyop/mixin/InputConstantsMixin.java
          grep -Fq 'SkyOPSdlKeyboardIndex.isValidStateIndex(key)' src/client/java/id/skyop/mixin/InputConstantsMixin.java
          if grep -Fq 'isKeyDown(JI)Z' src/client/java/id/skyop/mixin/InputConstantsMixin.java; then
            echo 'Minecraft 26.3 uses InputConstants.isKeyDown(int), not the old window-handle signature.' >&2
            exit 1
          fi
          grep -Fq '"InputConstantsMixin"' src/main/resources/skyop.mixins.json
          grep -Fq 'InputConstants.UNKNOWN.getValue()' src/client/java/id/skyop/client/SkyOPCore.java
          grep -Fq 'InputConstants.UNKNOWN' src/client/java/id/skyop/client/SkyOPCore.java
          if grep -Fq 'InputConstants.Type.KEYBOARD, -1' src/client/java/id/skyop/client/SkyOPCore.java; then
            echo 'Do not hardcode an invalid SDL key index; use the vanilla UNKNOWN key.' >&2
            exit 1
          fi

          # Mouse capture must recover after the GUI closes, without stealing focus from screens.
          grep -Fq 'ensureMouseCaptured(client);' src/client/java/id/skyop/client/SkyOPCore.java
          grep -Fq 'client.mouseHandler.isMouseGrabbed()' src/client/java/id/skyop/client/SkyOPCore.java
          grep -Fq 'client.mouseHandler.grabMouse();' src/client/java/id/skyop/client/SkyOPCore.java
          grep -Fq 'client.gui.screen() != null' src/client/java/id/skyop/client/SkyOPCore.java

          # Language and module registry invariants.
          grep -Fq 'SkyOPLanguage.set(p.getProperty("language", "id"));' src/client/java/id/skyop/client/SkyOPCore.java
          grep -Fq 'new Language("id", "Bahasa Indonesia")' src/client/java/id/skyop/client/SkyOPLanguage.java
          grep -Fq 'new Language("en", "English")' src/client/java/id/skyop/client/SkyOPLanguage.java
          grep -Fq 'CURRENT_CONFIG_VERSION = 2' src/client/java/id/skyop/client/SkyOPConfigManager.java
          grep -Fq 'SkyOPCore.initialize();' src/client/java/id/skyop/client/SkyOPClient.java
          grep -Fq 'SkyOPModuleManager.initialize();' src/client/java/id/skyop/client/SkyOPCore.java
          grep -Fq 'SkyOPModuleManager.saveSettings(p);' src/client/java/id/skyop/client/SkyOPCore.java
          grep -Fq 'SkyOPModuleManager.loadSettings(p);' src/client/java/id/skyop/client/SkyOPCore.java
          test -s src/main/resources/assets/skyop/lang/id_id.json
          grep -Fq '"key.skyop.module.auto_hunt"' src/main/resources/assets/skyop/lang/id_id.json
          grep -Fq '"key.skyop.module.fast_break"' src/main/resources/assets/skyop/lang/en_us.json
          grep -Fq '"key.skyop.module.fast_break"' src/main/resources/assets/skyop/lang/id_id.json
          grep -Fq '"key.skyop.module.auto_mlg"' src/main/resources/assets/skyop/lang/en_us.json
          grep -Fq '"key.skyop.module.auto_totem"' src/main/resources/assets/skyop/lang/en_us.json
          grep -Fq '"key.skyop.module.auto_mlg"' src/main/resources/assets/skyop/lang/id_id.json
          grep -Fq '"key.skyop.module.auto_totem"' src/main/resources/assets/skyop/lang/id_id.json
          grep -Fq 'return SkyOPModuleManager.settings(module);' src/client/java/id/skyop/client/SkyOPClickGui.java
          grep -Fq 'instanceof NumberSetting' src/client/java/id/skyop/client/SkyOPClickGui.java
          grep -Fq 'instanceof BooleanSetting' src/client/java/id/skyop/client/SkyOPClickGui.java
          grep -Fq 'instanceof ModeSetting' src/client/java/id/skyop/client/SkyOPClickGui.java
          grep -Fq 'instanceof MultiSetting' src/client/java/id/skyop/client/SkyOPClickGui.java
          grep -Fq 'instanceof ColorSetting' src/client/java/id/skyop/client/SkyOPClickGui.java
          grep -Fq 'instanceof KeybindSetting' src/client/java/id/skyop/client/SkyOPClickGui.java
          grep -Fq 'SkyOPInventoryModules.AutoEat' src/client/java/id/skyop/client/SkyOPModuleManager.java

          if [[ $(wc -l < src/client/java/id/skyop/client/SkyOPClient.java) -gt 30 ]]; then
            echo 'SkyOPClient must remain a bootstrap-only entrypoint.' >&2
            exit 1
          fi

          # Phase A diagnostics, error isolation and predicted Auto MLG landing.
          test -s src/client/java/id/skyop/client/SkyOPDiagnostics.java
          test -s src/client/java/id/skyop/client/SkyOPDiagnosticsScreen.java
          grep -Fq 'SkyOPDiagnostics.recordError' src/client/java/id/skyop/client/SkyOPModuleManager.java
          grep -Fq 'SkyOPDiagnostics.shouldDisableAfterErrors(errors)' src/client/java/id/skyop/client/SkyOPModuleManager.java
          grep -Fq 'skyop.log' src/client/java/id/skyop/client/SkyOPDiagnostics.java
          grep -Fq 'new SkyOPDiagnosticsScreen' src/client/java/id/skyop/client/SkyOPCore.java
          grep -Fq 'key.skyop.diagnostics' src/client/java/id/skyop/client/SkyOPCore.java
          grep -Fq 'predictLandingSurface' src/client/java/id/skyop/client/SkyOPMovementModules.java
          grep -Fq 'ClipContext.Block.COLLIDER' src/client/java/id/skyop/client/SkyOPMovementModules.java
          grep -Fq 'diagnostics.reason.no_bucket' src/client/java/id/skyop/client/SkyOPMovementModules.java
          grep -Fq 'diagnostics.reason.health_above' src/client/java/id/skyop/client/SkyOPInventoryManager.java
          grep -Fq 'advanceFall' src/client/java/id/skyop/client/SkyOPAutomationRules.java
          grep -Fq 'fallPredictionAdvancesPositionAndAppliesAirDragAndGravity' src/test/java/id/skyop/client/SkyOPAutomationRulesTest.java
          grep -Fq 'moduleIsAutoDisabledOnThirdRecordedFailure' src/test/java/id/skyop/client/SkyOPAutomationRulesTest.java
          grep -Fq 'hasteFiftyMatchesElevenTimesVanillaMiningSpeed' src/test/java/id/skyop/client/SkyOPFastBreakTest.java
          grep -Fq 'diagnostics.title' src/client/java/id/skyop/client/SkyOPLanguage.java
          grep -Fq 'key.skyop.diagnostics' src/main/resources/assets/skyop/lang/id_id.json
          grep -Fq 'key.skyop.diagnostics' src/main/resources/assets/skyop/lang/en_us.json
          # Fast Break, Auto MLG and Auto Totem must be registered and tested.
          grep -Fq 'number("fastBreakLevel", 50, 1, 50, true)' src/client/java/id/skyop/client/SkyOPSettingsSchema.java
          grep -Fq 'number("autoMlgFallDistance", 6, 3, 18, false)' src/client/java/id/skyop/client/SkyOPSettingsSchema.java
          grep -Fq 'number("autoTotemHealth", 14, 1, 20, false)' src/client/java/id/skyop/client/SkyOPSettingsSchema.java
          grep -Fq 'getDestroySpeed(Lnet/minecraft/world/level/block/state/BlockState;)F' src/client/java/id/skyop/mixin/FastBreakMixin.java
          grep -Fq '"FastBreakMixin"' src/main/resources/skyop.mixins.json
          grep -Fq 'case AUTO_MLG -> new SkyOPMovementModules.AutoMlg(settings);' src/client/java/id/skyop/client/SkyOPModuleManager.java
          grep -Fq 'case AUTO_TOTEM -> new SkyOPInventoryModules.AutoTotem(settings);' src/client/java/id/skyop/client/SkyOPModuleManager.java
          test -s src/test/java/id/skyop/client/SkyOPAutomationRulesTest.java
          grep -Fq 'SkyOPFastBreak.multiplierForLevel' src/test/java/id/skyop/client/SkyOPFastBreakTest.java
          grep -Fq 'playerInventorySlotToMenuSlot' src/client/java/id/skyop/client/SkyOPAutomationRules.java
          grep -Fq 'SkyOPAutomationRules.playerInventorySlotToMenuSlot(inventorySlot)' src/client/java/id/skyop/client/SkyOPInventoryManager.java
          grep -Fq 'HitResult.Type.BLOCK' src/client/java/id/skyop/client/SkyOPMovementModules.java
          grep -Fq 'client.gameMode.useItem(player, InteractionHand.MAIN_HAND);' src/client/java/id/skyop/client/SkyOPMovementModules.java
          grep -Fq 'player.setXRot(originalPitch);' src/client/java/id/skyop/client/SkyOPMovementModules.java
          grep -Fq 'getSingleplayerServer()' src/client/java/id/skyop/client/SkyOPFastBreak.java
          grep -Fq 'getPlayer(client.player.getUUID())' src/client/java/id/skyop/client/SkyOPFastBreak.java
          grep -Fq 'playerInventorySlotsMapToVanillaMenuSlots' src/test/java/id/skyop/client/SkyOPAutomationRulesTest.java
          grep -Fq 'SkyOP 3.0 review feedback' docs/TEST-PLAN.md

          JAR_ENTRIES="$(jar tf "$JAR_PATH")"
          printf '%s\n' "$JAR_ENTRIES" | grep -q '^id/skyop/client/SkyOPClient.class$'
          printf '%s\n' "$JAR_ENTRIES" | grep -q '^id/skyop/mixin/SkyOPFishingHookAccessor.class$'
          printf '%s\n' "$JAR_ENTRIES" | grep -q '^id/skyop/mixin/InputConstantsMixin.class$'
          printf '%s\n' "$JAR_ENTRIES" | grep -q '^id/skyop/mixin/FastBreakMixin.class$'
          printf '%s\n' "$JAR_ENTRIES" | grep -q '^id/skyop/client/SkyOPSdlKeyboardIndex.class$'
          printf '%s\n' "$JAR_ENTRIES" | grep -q '^id/skyop/client/SkyOPDiagnostics.class
          printf '%s\n' "$JAR_ENTRIES" | grep -q '^id/skyop/client/SkyOPPlayerModules\$FastBreak.class$'
          printf '%s\n' "$JAR_ENTRIES" | grep -q '^id/skyop/client/SkyOPAutomationRules.class$'
          printf '%s\n' "$JAR_ENTRIES" | grep -q '^id/skyop/client/SkyOPMovementModules\$AutoMlg.class$'
          printf '%s\n' "$JAR_ENTRIES" | grep -q '^id/skyop/client/SkyOPInventoryModules\$AutoTotem.class$'
          if printf '%s\n' "$JAR_ENTRIES" | grep -q '^id/skyop/client/SkyOPFishingHookAccessor.class$'; then
            echo 'Mixin accessor must not remain in the client entrypoint package.' >&2
            exit 1
          fi
          unzip -p "$JAR_PATH" fabric.mod.json | grep -q '"id": "skyop"'
          unzip -p "$JAR_PATH" skyop.mixins.json | grep -q '"package": "id.skyop.mixin"'
          echo "Verified installable JAR: $JAR_PATH"
          echo "SKYOP_JAR_PATH=$JAR_PATH" >> "$GITHUB_ENV"

      - name: Upload ready-to-install JAR
        uses: actions/upload-artifact@v4
        with:
          name: SkyOP-Client-Minecraft-26.3
          path: ${{ env.SKYOP_JAR_PATH }}
          if-no-files-found: error
          retention-days: 30

          printf '%s\n' "$JAR_ENTRIES" | grep -q '^id/skyop/client/SkyOPDiagnosticsScreen.class
          printf '%s\n' "$JAR_ENTRIES" | grep -q '^id/skyop/client/SkyOPPlayerModules\$FastBreak.class$'
          printf '%s\n' "$JAR_ENTRIES" | grep -q '^id/skyop/client/SkyOPAutomationRules.class$'
          printf '%s\n' "$JAR_ENTRIES" | grep -q '^id/skyop/client/SkyOPMovementModules\$AutoMlg.class$'
          printf '%s\n' "$JAR_ENTRIES" | grep -q '^id/skyop/client/SkyOPInventoryModules\$AutoTotem.class$'
          if printf '%s\n' "$JAR_ENTRIES" | grep -q '^id/skyop/client/SkyOPFishingHookAccessor.class$'; then
            echo 'Mixin accessor must not remain in the client entrypoint package.' >&2
            exit 1
          fi
          unzip -p "$JAR_PATH" fabric.mod.json | grep -q '"id": "skyop"'
          unzip -p "$JAR_PATH" skyop.mixins.json | grep -q '"package": "id.skyop.mixin"'
          echo "Verified installable JAR: $JAR_PATH"
          echo "SKYOP_JAR_PATH=$JAR_PATH" >> "$GITHUB_ENV"

      - name: Upload ready-to-install JAR
        uses: actions/upload-artifact@v4
        with:
          name: SkyOP-Client-Minecraft-26.3
          path: ${{ env.SKYOP_JAR_PATH }}
          if-no-files-found: error
          retention-days: 30

          printf '%s\n' "$JAR_ENTRIES" | grep -q '^id/skyop/client/SkyOPFastBreak.class
          printf '%s\n' "$JAR_ENTRIES" | grep -q '^id/skyop/client/SkyOPPlayerModules\$FastBreak.class$'
          printf '%s\n' "$JAR_ENTRIES" | grep -q '^id/skyop/client/SkyOPAutomationRules.class$'
          printf '%s\n' "$JAR_ENTRIES" | grep -q '^id/skyop/client/SkyOPMovementModules\$AutoMlg.class$'
          printf '%s\n' "$JAR_ENTRIES" | grep -q '^id/skyop/client/SkyOPInventoryModules\$AutoTotem.class$'
          if printf '%s\n' "$JAR_ENTRIES" | grep -q '^id/skyop/client/SkyOPFishingHookAccessor.class$'; then
            echo 'Mixin accessor must not remain in the client entrypoint package.' >&2
            exit 1
          fi
          unzip -p "$JAR_PATH" fabric.mod.json | grep -q '"id": "skyop"'
          unzip -p "$JAR_PATH" skyop.mixins.json | grep -q '"package": "id.skyop.mixin"'
          echo "Verified installable JAR: $JAR_PATH"
          echo "SKYOP_JAR_PATH=$JAR_PATH" >> "$GITHUB_ENV"

      - name: Upload ready-to-install JAR
        uses: actions/upload-artifact@v4
        with:
          name: SkyOP-Client-Minecraft-26.3
          path: ${{ env.SKYOP_JAR_PATH }}
          if-no-files-found: error
          retention-days: 30

          printf '%s\n' "$JAR_ENTRIES" | grep -q '^id/skyop/client/SkyOPPlayerModules\$FastBreak.class$'
          printf '%s\n' "$JAR_ENTRIES" | grep -q '^id/skyop/client/SkyOPAutomationRules.class$'
          printf '%s\n' "$JAR_ENTRIES" | grep -q '^id/skyop/client/SkyOPMovementModules\$AutoMlg.class$'
          printf '%s\n' "$JAR_ENTRIES" | grep -q '^id/skyop/client/SkyOPInventoryModules\$AutoTotem.class$'
          if printf '%s\n' "$JAR_ENTRIES" | grep -q '^id/skyop/client/SkyOPFishingHookAccessor.class$'; then
            echo 'Mixin accessor must not remain in the client entrypoint package.' >&2
            exit 1
          fi
          unzip -p "$JAR_PATH" fabric.mod.json | grep -q '"id": "skyop"'
          unzip -p "$JAR_PATH" skyop.mixins.json | grep -q '"package": "id.skyop.mixin"'
          echo "Verified installable JAR: $JAR_PATH"
          echo "SKYOP_JAR_PATH=$JAR_PATH" >> "$GITHUB_ENV"

      - name: Upload ready-to-install JAR
        uses: actions/upload-artifact@v4
        with:
          name: SkyOP-Client-Minecraft-26.3
          path: ${{ env.SKYOP_JAR_PATH }}
          if-no-files-found: error
          retention-days: 30
