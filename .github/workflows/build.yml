name: Build SkyOP Client

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skyop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile Minecraft 26.3 mod
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Build and run verification tasks
        run: gradle --no-daemon clean build

      - name: Verify installable mod JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR_PATH="$(find build/libs -maxdepth 1 -type f -name 'skyop-client-*.jar' ! -name '*-sources.jar' | sort | head -n 1)"
          if [[ -z "$JAR_PATH" ]]; then
            echo 'No SkyOP mod JAR was produced.'
            find build/libs -maxdepth 1 -type f -print || true
            exit 1
          fi

          # SDL keyboard-state buffers are indexed by 0..SDL_SCANCODE_COUNT-1.
          # Keep vanilla UNKNOWN semantics, but guard every lookup before ByteBuffer access.
          grep -Fq 'SDL_SCANCODE_COUNT = 512' src/main/java/id/skyop/client/SkyOPSdlKeyboardIndex.java
          grep -Fq 'method = "isKeyDown(I)Z"' src/client/java/id/skyop/mixin/InputConstantsMixin.java
          grep -Fq 'getDestroySpeed(Lnet/minecraft/world/level/block/state/BlockState;)F' src/client/java/id/skyop/mixin/FastBreakMixin.java
          grep -Fq 'FastBreakMixin' src/main/resources/skyop.mixins.json
          grep -Fq 'int key' src/client/java/id/skyop/mixin/InputConstantsMixin.java
          grep -Fq 'SkyOPSdlKeyboardIndex.isValidStateIndex(key)' src/client/java/id/skyop/mixin/InputConstantsMixin.java
          if grep -Fq 'isKeyDown(JI)Z' src/client/java/id/skyop/mixin/InputConstantsMixin.java; then
            echo 'Minecraft 26.3 uses InputConstants.isKeyDown(int), not the old window-handle signature.' >&2
            exit 1
          fi
          grep -Fq '"InputConstantsMixin"' src/main/resources/skyop.mixins.json
          grep -Fq 'InputConstants.UNKNOWN.getValue()' src/client/java/id/skyop/client/SkyOPCore.java
          grep -Fq 'InputConstants.UNKNOWN' src/client/java/id/skyop/client/SkyOPCore.java
          if grep -Fq 'InputConstants.Type.KEYBOARD, -1' src/client/java/id/skyop/client/SkyOPCore.java; then
            echo 'Do not hardcode an invalid SDL key index; use the vanilla UNKNOWN key and the bounds guard.' >&2
            exit 1
          fi
          # Prevent regression: gameplay must re-acquire SDL relative mouse mode
          # after a UI closes, but only when the game is focused and no UI is open.
          grep -Fq 'ensureMouseCaptured(client);' src/client/java/id/skyop/client/SkyOPCore.java
          grep -Fq 'client.mouseHandler.isMouseGrabbed()' src/client/java/id/skyop/client/SkyOPCore.java
          grep -Fq 'client.mouseHandler.grabMouse();' src/client/java/id/skyop/client/SkyOPCore.java
          grep -Fq 'client.gui.screen() != null' src/client/java/id/skyop/client/SkyOPCore.java
          # Indonesian is the first-run default and must have module translations.
          grep -Fq 'SkyOPLanguage.set(p.getProperty("language", "id"));' src/client/java/id/skyop/client/SkyOPCore.java
          grep -Fq 'new Language("en", "English")' src/client/java/id/skyop/client/SkyOPLanguage.java
          grep -Fq 'CURRENT_CONFIG_VERSION = 2' src/client/java/id/skyop/client/SkyOPConfigManager.java
          grep -Fq 'SkyOPCore.initialize();' src/client/java/id/skyop/client/SkyOPClient.java
          grep -Fq 'SkyOPModuleManager.initialize();' src/client/java/id/skyop/client/SkyOPCore.java
          grep -Fq 'SkyOPModuleManager.saveSettings(p);' src/client/java/id/skyop/client/SkyOPCore.java
          grep -Fq 'SkyOPModuleManager.loadSettings(p);' src/client/java/id/skyop/client/SkyOPCore.java
          grep -Fq 'new Language("id", "Bahasa Indonesia")' src/client/java/id/skyop/client/SkyOPLanguage.java
          grep -Fq 'new Language("en", "English")' src/client/java/id/skyop/client/SkyOPLanguage.java
          test -s src/main/resources/assets/skyop/lang/id_id.json
          grep -Fq '"key.skyop.module.auto_hunt"' src/main/resources/assets/skyop/lang/id_id.json
          grep -Fq 'return SkyOPModuleManager.settings(module);' src/client/java/id/skyop/client/SkyOPClickGui.java
          grep -Fq 'instanceof NumberSetting' src/client/java/id/skyop/client/SkyOPClickGui.java
          grep -Fq 'instanceof BooleanSetting' src/client/java/id/skyop/client/SkyOPClickGui.java
          grep -Fq 'instanceof ModeSetting' src/client/java/id/skyop/client/SkyOPClickGui.java
          grep -Fq 'instanceof MultiSetting' src/client/java/id/skyop/client/SkyOPClickGui.java
          grep -Fq 'instanceof ColorSetting' src/client/java/id/skyop/client/SkyOPClickGui.java
          grep -Fq 'instanceof KeybindSetting' src/client/java/id/skyop/client/SkyOPClickGui.java
          if [[ $(wc -l < src/client/java/id/skyop/client/SkyOPClient.java) -gt 30 ]]; then
            echo 'SkyOPClient must remain a bootstrap-only entrypoint.' >&2
            exit 1
          fi
          grep -Fq 'SkyOPModuleManager.settings(module)' src/client/java/id/skyop/client/SkyOPClickGui.java
          grep -Fq 'SkyOPInventoryModules.AutoEat' src/client/java/id/skyop/client/SkyOPModuleManager.java
          if grep -Fq 'InputConstants.Type.KEYBOARD, -1' src/client/java/id/skyop/client/SkyOPCore.java; then
            echo 'Unbound key mappings must not pass raw -1 to the SDL keyboard backend.' >&2
            exit 1
          fi

          JAR_ENTRIES="$(jar tf "$JAR_PATH")"
          printf '%s\n' "$JAR_ENTRIES" | grep -q '^id/skyop/client/SkyOPClient.class$'
          printf '%s\n' "$JAR_ENTRIES" | grep -q '^id/skyop/mixin/SkyOPFishingHookAccessor.class$'
          printf '%s\n' "$JAR_ENTRIES" | grep -q '^id/skyop/mixin/InputConstantsMixin.class          printf '%s\n' "$JAR_ENTRIES" | grep -q '^id/skyop/client/SkyOPSdlKeyboardIndex.class$'
          if printf '%s\n' "$JAR_ENTRIES" | grep -q '^id/skyop/client/SkyOPFishingHookAccessor.class$'; then
            echo 'Mixin accessor must not remain in the client entrypoint package.' >&2
            exit 1
          fi
          unzip -p "$JAR_PATH" fabric.mod.json | grep -q '"id": "skyop"'
          unzip -p "$JAR_PATH" skyop.mixins.json | grep -q '"package": "id.skyop.mixin"'
          echo "Verified installable JAR: $JAR_PATH"
          echo "SKYOP_JAR_PATH=$JAR_PATH" >> "$GITHUB_ENV"

      - name: Upload ready-to-install JAR
        uses: actions/upload-artifact@v4
        with:
          name: SkyOP-Client-Minecraft-26.3
          path: ${{ env.SKYOP_JAR_PATH }}
          if-no-files-found: error
          retention-days: 30

          printf '%s\n' "$JAR_ENTRIES" | grep -q '^id/skyop/mixin/FastBreakMixin.class          printf '%s\n' "$JAR_ENTRIES" | grep -q '^id/skyop/client/SkyOPSdlKeyboardIndex.class$'
          if printf '%s\n' "$JAR_ENTRIES" | grep -q '^id/skyop/client/SkyOPFishingHookAccessor.class$'; then
            echo 'Mixin accessor must not remain in the client entrypoint package.' >&2
            exit 1
          fi
          unzip -p "$JAR_PATH" fabric.mod.json | grep -q '"id": "skyop"'
          unzip -p "$JAR_PATH" skyop.mixins.json | grep -q '"package": "id.skyop.mixin"'
          echo "Verified installable JAR: $JAR_PATH"
          echo "SKYOP_JAR_PATH=$JAR_PATH" >> "$GITHUB_ENV"

      - name: Upload ready-to-install JAR
        uses: actions/upload-artifact@v4
        with:
          name: SkyOP-Client-Minecraft-26.3
          path: ${{ env.SKYOP_JAR_PATH }}
          if-no-files-found: error
          retention-days: 30

          printf '%s\n' "$JAR_ENTRIES" | grep -q '^id/skyop/client/SkyOPFastBreak.class          printf '%s\n' "$JAR_ENTRIES" | grep -q '^id/skyop/client/SkyOPSdlKeyboardIndex.class$'
          if printf '%s\n' "$JAR_ENTRIES" | grep -q '^id/skyop/client/SkyOPFishingHookAccessor.class$'; then
            echo 'Mixin accessor must not remain in the client entrypoint package.' >&2
            exit 1
          fi
          unzip -p "$JAR_PATH" fabric.mod.json | grep -q '"id": "skyop"'
          unzip -p "$JAR_PATH" skyop.mixins.json | grep -q '"package": "id.skyop.mixin"'
          echo "Verified installable JAR: $JAR_PATH"
          echo "SKYOP_JAR_PATH=$JAR_PATH" >> "$GITHUB_ENV"

      - name: Upload ready-to-install JAR
        uses: actions/upload-artifact@v4
        with:
          name: SkyOP-Client-Minecraft-26.3
          path: ${{ env.SKYOP_JAR_PATH }}
          if-no-files-found: error
          retention-days: 30

          printf '%s\n' "$JAR_ENTRIES" | grep -q '^id/skyop/client/SkyOPPlayerModules$FastBreak.class          printf '%s\n' "$JAR_ENTRIES" | grep -q '^id/skyop/client/SkyOPSdlKeyboardIndex.class$'
          if printf '%s\n' "$JAR_ENTRIES" | grep -q '^id/skyop/client/SkyOPFishingHookAccessor.class$'; then
            echo 'Mixin accessor must not remain in the client entrypoint package.' >&2
            exit 1
          fi
          unzip -p "$JAR_PATH" fabric.mod.json | grep -q '"id": "skyop"'
          unzip -p "$JAR_PATH" skyop.mixins.json | grep -q '"package": "id.skyop.mixin"'
          echo "Verified installable JAR: $JAR_PATH"
          echo "SKYOP_JAR_PATH=$JAR_PATH" >> "$GITHUB_ENV"

      - name: Upload ready-to-install JAR
        uses: actions/upload-artifact@v4
        with:
          name: SkyOP-Client-Minecraft-26.3
          path: ${{ env.SKYOP_JAR_PATH }}
          if-no-files-found: error
          retention-days: 30

          printf '%s\n' "$JAR_ENTRIES" | grep -q '^id/skyop/client/SkyOPSdlKeyboardIndex.class$'
          if printf '%s\n' "$JAR_ENTRIES" | grep -q '^id/skyop/client/SkyOPFishingHookAccessor.class$'; then
            echo 'Mixin accessor must not remain in the client entrypoint package.' >&2
            exit 1
          fi
          unzip -p "$JAR_PATH" fabric.mod.json | grep -q '"id": "skyop"'
          unzip -p "$JAR_PATH" skyop.mixins.json | grep -q '"package": "id.skyop.mixin"'
          echo "Verified installable JAR: $JAR_PATH"
          echo "SKYOP_JAR_PATH=$JAR_PATH" >> "$GITHUB_ENV"

      - name: Upload ready-to-install JAR
        uses: actions/upload-artifact@v4
        with:
          name: SkyOP-Client-Minecraft-26.3
          path: ${{ env.SKYOP_JAR_PATH }}
          if-no-files-found: error
          retention-days: 30
