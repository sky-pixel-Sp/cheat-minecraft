name: Build SkyOP Password Generator

on:
  push:
    paths:
      - 'tools/password-generator/**'
      - '.github/workflows/build-password-generator.yml'
  pull_request:
    paths:
      - 'tools/password-generator/**'
      - '.github/workflows/build-password-generator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-exe:
    name: Package Windows password generator
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Python source
        run: python -m py_compile tools/password-generator/skyop_password_generator.py

      - name: Install PyInstaller
        run: python -m pip install --disable-pip-version-check pyinstaller

      - name: Build standalone EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name SkyOP-Password-Generator tools/password-generator/skyop_password_generator.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyOP-Password-Generator-Windows-x64
          path: dist/SkyOP-Password-Generator.exe
          if-no-files-found: error
          retention-days: 30
